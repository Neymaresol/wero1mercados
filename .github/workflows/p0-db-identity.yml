name: P0 database identity Double Check
on:
  pull_request:
    paths:
      - 'integrations/db_identity_doublecheck.py'
      - 'tests/test_db_identity_doublecheck.py'
      - '.github/workflows/p0-db-identity.yml'
  workflow_dispatch:
jobs:
  identity-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile identity module
        run: python -m py_compile integrations/db_identity_doublecheck.py
      - name: Run isolated identity tests
        run: python -m pytest -q tests/test_db_identity_doublecheck.py
