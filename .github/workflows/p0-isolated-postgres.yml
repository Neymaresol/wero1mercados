name: P0 Isolated PostgreSQL Double Check
on:
  pull_request:
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: p0test
          POSTGRES_PASSWORD: p0test
          POSTGRES_DB: p0test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p0test -d p0test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P0_TEST_DATABASE_URL: postgresql://p0test:p0test@localhost:5432/p0test
      WERO_MODE: homologation
      DATABASE_URL: postgresql://p0test:p0test@localhost:5432/p0test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx2
      - name: Compile P0 Python
        run: python -m py_compile main.py p0_conversion_gate.py scripts/p0_database_identity.py tests/test_p0_postgres_integration.py
      - name: Compile outbound token helper when present
        run: |
          if [ -f p0_outbound_action.py ]; then python -m py_compile p0_outbound_action.py; fi
      - name: Offline provenance tests
        run: python -m unittest discover -s tests -p 'test_p0_funnel_provenance_20261013.py' -v
      - name: Offline outbound token tests when present
        run: |
          if [ -f tests/test_p0_outbound_action.py ]; then
            python -m unittest discover -s tests -p 'test_p0_outbound_action.py' -v
          fi
      - name: Real HTTP/Postgres integration tests
        run: python -m unittest discover -s tests -p 'test_p0_postgres_integration.py' -v
